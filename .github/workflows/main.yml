name: React CI/CD to VPS

on:
  push:
    branches: [ "master" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/pffda-fe:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
          script: |
            # Login to Docker (required if your repo is private)
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            
            # Stop and remove the old container
            docker stop pffda-fe-instance || true
            docker rm pffda-fe-instance || true
            
            # Pull the latest image
            docker pull ${{ secrets.DOCKER_USERNAME }}/pffda-fe:latest
            
            # Run the new container on Port 5174
            docker run -d \
              --name pffda-fe-instance \
              --restart always \
              -p 5174:5174 \
              ${{ secrets.DOCKER_USERNAME }}/pffda-fe:latest